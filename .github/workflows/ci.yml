name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: dist/ must be committed up to date (it is what npx/GitHub installs run)
        run: git diff --exit-code -- dist
      - run: npm test
